<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LeadLink Local</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f5f4;color:#18181b}header{background:#18181b;color:#fff;padding:12px 16px;font-weight:700}main{max-width:720px;margin:auto;padding:16px}.card{background:#fff;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 1px 3px #0002}input,select,button,textarea{font-size:16px;padding:10px;border-radius:8px;border:1px solid #ccc;width:100%;box-sizing:border-box;margin:4px 0}button{background:#2a78d6;color:#fff;border:0;font-weight:600}button.alt{background:#555}.code{font-size:32px;font-weight:800;letter-spacing:2px;text-align:center;padding:12px;background:#eef5ff;border-radius:8px}.flag{background:#fee2e2;color:#991b1b;padding:4px 8px;border-radius:6px;font-size:13px}.muted{color:#666;font-size:13px;word-break:break-all}nav button{width:auto;margin-right:6px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid #eee;padding:6px;text-align:left}.row{display:flex;gap:8px}.row>*{flex:1}@media print{header,nav,button{display:none}}</style></head>
<body><header>LeadLink Local</header><main id="app">Loading…</main>
<script>
const URL_="https://cjtutkvhyzjsgclqvylg.supabase.co",KEY="sb_publishable_E48ovT9wWxduLxnzPXL_5g_SnNl2rqz";
const BASE=location.origin+location.pathname;
async function rpc(fn,args){const r=await fetch(URL_+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(args)});const j=await r.json();if(!r.ok)throw new Error(j.message||"Error");return j}
const $=s=>document.querySelector(s),app=$("#app"),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),money=n=>"$"+Number(n||0).toFixed(2);
const err=e=>`<p class=flag>${esc(e.message)}</p>`;
function route(){const h=location.hash.slice(2);const [p,rest]=h.split("/");const [id,qs]=(rest||"").split("?");const q=new URLSearchParams(qs||"");
 if(p==="ad")return adPage(id,q.get("src")||"direct");if(p==="c")return custPage(id);if(p==="o")return ownerPage(id);if(p==="pitch")return pitch();if(p==="inv")return invoice(id);return admin()}
window.onhashchange=route;

async function adPage(slug,src){const b=await rpc("ll_public_business",{p_slug:slug});if(!b){app.innerHTML="<div class=card>Offer not found.</div>";return}
 app.innerHTML=`<div class=card><h2>${esc(b.name)}</h2><p style="font-size:18px">${esc(b.offer)}</p><p class=muted>Get your code and show it when you book.</p>
 <input id=n placeholder="Your name"><input id=p placeholder="Phone number" inputmode=tel><button id=go>Get my code</button><div id=out></div></div>`;
 $("#go").onclick=async()=>{try{const r=await rpc("ll_claim",{p_slug:slug,p_name:$("#n").value,p_phone:$("#p").value,p_src:src});
  const link=BASE+"#/c/"+r.key;$("#out").innerHTML=`<p>Your code:</p><div class=code>${r.code}</div><p>Show this to ${esc(b.name)}${b.phone?" ("+esc(b.phone)+")":""} when you book.</p><p class=muted>Save this link to check your code or confirm your purchase later:<br><a href="${link}">${link}</a></p>`}catch(e){$("#out").innerHTML=err(e)}}}

async function custPage(key){const l=await rpc("ll_customer_view",{p_key:key});if(!l){app.innerHTML="<div class=card>Link not found.</div>";return}
 app.innerHTML=`<div class=card><h2>${esc(l.business)}</h2><div class=code>${l.code}</div><p>${esc(l.offer)}</p>
 <h3>Did you buy?</h3><p class=muted>This keeps the deal fair. ${l.cust_bought!=null?"You answered: "+(l.cust_bought?"Yes, about "+money(l.cust_amount):"No")+". You can update it.":""}</p>
 <input id=a type=number placeholder="About how much? ($)" inputmode=decimal><div class=row><button id=y>Yes, I bought</button><button class=alt id=no>No</button></div><div id=out></div></div>`;
 const send=async b=>{try{await rpc("ll_customer_confirm",{p_key:key,p_bought:b,p_amount:b?Number($("#a").value)||null:null});$("#out").innerHTML="<p>Thanks! Saved.</p>"}catch(e){$("#out").innerHTML=err(e)}};
 $("#y").onclick=()=>send(true);$("#no").onclick=()=>send(false)}

async function ownerPage(key){let d;try{d=await rpc("ll_owner_view",{p_key:key})}catch(e){}if(!d){app.innerHTML="<div class=card>Owner link not found.</div>";return}
 const b=d.business,owed=d.leads.filter(l=>!l.paid_at).reduce((s,l)=>s+Number(l.fee),0);
 app.innerHTML=`<div class=card><h2>${esc(b.name)}: Owner Portal</h2><p>Leads: <b>${d.leads.length}</b> · Sold: <b>${d.leads.filter(l=>l.status==="sold").length}</b> · Referral fees owed: <b>${money(owed)}</b></p>${b.active?"":"<p class=flag>Ads for your business are paused. Contact LeadLink to restart them.</p>"}<p class=muted>Payment due ${b.pay_days} days after each sale. Fee: ${money(b.flat_fee)} per sale, or ${b.pct}% on jobs of ${money(b.pct_threshold)}+. Customers also confirm purchases; every update is time-stamped.</p></div>
 <div class=card><h3>Update a lead</h3><input id=c placeholder="Customer code"><select id=s><option value=contacted>Contacted</option><option value=sold>Sold</option><option value=not_sold>Not sold</option></select><input id=a type=number placeholder="Job total ($), if sold" inputmode=decimal><button id=go>Save</button><div id=out></div></div>
 <div class=card><h3>Your leads</h3><table><tr><th>Code</th><th>Customer</th><th>Status</th><th>Total</th><th>Fee</th></tr>${d.leads.map(l=>`<tr><td>${l.code}</td><td>${esc(l.name)}<br><span class=muted>${esc(l.phone)}</span></td><td>${l.status}</td><td>${l.amount?money(l.amount):""}</td><td>${money(l.fee)}${l.status==="sold"?`<br><span class=muted>${l.paid_at?"paid":"due "+new Date(l.due).toLocaleDateString()}</span>`:""}</td></tr>`).join("")}</table></div>`;
 $("#go").onclick=async()=>{try{await rpc("ll_owner_mark",{p_key:key,p_code:$("#c").value,p_status:$("#s").value,p_amount:Number($("#a").value)||null});ownerPage(key)}catch(e){$("#out").innerHTML=err(e)}}}

let LAST=null;
async function admin(){let k=localStorage.llAdmin;if(!k){app.innerHTML=`<div class=card><h2>Leon's Dashboard</h2><input id=k placeholder="Admin key"><button id=go>Open</button></div>`;$("#go").onclick=()=>{localStorage.llAdmin=$("#k").value.trim();admin()};return}
 let d;try{d=await rpc("ll_admin_view",{p_admin:k})}catch(e){delete localStorage.llAdmin;return admin()}LAST=d;
 const flags=d.leads.filter(l=>l.flag),owed=d.businesses.reduce((s,b)=>s+Number(b.owed),0);
 const srcs={};d.leads.forEach(l=>{const s=srcs[l.src]=srcs[l.src]||{n:0,sold:0};s.n++;if(l.status==="sold")s.sold++});
 app.innerHTML=`<nav><button onclick="location.hash='#/pitch'">Pitch Kit</button><button class=alt id=csv>Export CSV</button></nav>
 <div class=card><h2>Dashboard</h2><p>Businesses: <b>${d.businesses.length}</b> · Leads: <b>${d.leads.length}</b> · Sold: <b>${d.leads.filter(l=>l.status==="sold").length}</b> · You're owed: <b>${money(owed)}</b></p></div>
 <div class=card><h3>🚩 Red flags (${flags.length})</h3>${flags.map(l=>`<p><span class=flag>${esc(l.flag)}</span> ${esc(l.business)} · ${l.code} · ${esc(l.name)} ${esc(l.phone)} · owner: ${l.status} ${l.owner_amount?money(l.owner_amount):""} · customer: ${l.cust_amount?money(l.cust_amount):""}</p>`).join("")||"<p class=muted>None</p>"}</div>
 <div class=card><h3>Ads (TikTok tracking)</h3><table><tr><th>Source</th><th>Leads</th><th>Sold</th></tr>${Object.entries(srcs).map(([s,v])=>`<tr><td>${esc(s)}</td><td>${v.n}</td><td>${v.sold}</td></tr>`).join("")}</table></div>
 <div class=card><h3>Add / edit business</h3><input id=bs placeholder="Short id, e.g. joes-roofing"><input id=bn placeholder="Business name"><textarea id=bo placeholder="Customer offer, e.g. $200 off any roof repair"></textarea><input id=bp placeholder="Business phone">
 <div class=row><input id=bf type=number value=100><input id=bpc type=number value=10><input id=bt type=number value=1000></div><p class=muted>Flat fee $ · Percent % · Percent applies on jobs of $ or more</p><button id=save>Save business</button><div id=out></div></div>
 ${d.businesses.map(b=>{const ad=BASE+"#/ad/"+b.slug;return `<div class=card><h3>${esc(b.name)}</h3><p>${b.active?"<b style=color:#008300>● Ads ON</b>":"<span class=flag>● Ads STOPPED</span>"} · ${b.leads} leads · ${b.sold} sold</p><p>Unpaid: <b>${money(b.owed)}</b>${Number(b.overdue)>0?` · <span class=flag>Overdue ${money(b.overdue)}</span>`:""} · Paid: ${money(b.paid)}</p>
  <div class=row><button class="${b.active?"alt":""}" data-act="${b.slug}" data-on="${b.active?0:1}">${b.active?"Stop ads":"Turn ads back on"}</button><button data-inv="${b.slug}">Invoice</button><button class=alt data-paid="${b.slug}">Mark all paid</button></div>
  <div class=row><input type=number data-pd="${b.slug}" value="${b.pay_days}"><button class=alt data-pds="${b.slug}">Save pay deadline (days after sale)</button></div>
  <p class=muted>Ad link (add ?src=tiktok-video1 to the end to track each video):<br><a href="${ad}">${ad}</a></p><div class=qr data-u="${ad}?src=qr"></div>
  <p class=muted>Owner portal (send only to the owner):<br><a href="${BASE}#/o/${b.owner_key}">${BASE}#/o/${b.owner_key}</a></p></div>`}).join("")}
 <div class=card><h3>All leads</h3><table><tr><th>Biz</th><th>Code</th><th>Src</th><th>Status</th><th>Fee</th><th>Customer link</th></tr>${d.leads.map(l=>`<tr><td>${esc(l.business)}</td><td>${l.code}<br><span class=muted>${esc(l.name)} ${esc(l.phone)}</span></td><td>${esc(l.src)}</td><td>${l.status}</td><td>${money(l.fee)}${l.status==="sold"?`<br><span class=muted>${l.paid_at?"paid":"due "+new Date(l.due).toLocaleDateString()}</span>`:""}</td><td><a href="${BASE}#/c/${l.cust_key}">confirm link</a></td></tr>`).join("")}</table></div>`;
 document.querySelectorAll(".qr").forEach(el=>new QRCode(el,{text:el.dataset.u,width:140,height:140}));
 $("#save").onclick=async()=>{try{await rpc("ll_admin_save_business",{p_admin:k,p_slug:$("#bs").value.trim().replace(/\s+/g,"-"),p_name:$("#bn").value,p_offer:$("#bo").value,p_phone:$("#bp").value,p_flat:+$("#bf").value,p_pct:+$("#bpc").value,p_thr:+$("#bt").value});admin()}catch(e){$("#out").innerHTML=err(e)}};
 document.querySelectorAll("[data-act]").forEach(x=>x.onclick=async()=>{const on=x.dataset.on==="1";if(!on&&!confirm("Stop ads for this business? The ad link will stop giving out codes."))return;await rpc("ll_admin_set_active",{p_admin:k,p_slug:x.dataset.act,p_active:on});admin()});
 document.querySelectorAll("[data-paid]").forEach(x=>x.onclick=async()=>{if(!confirm("Mark every unpaid sale for this business as paid?"))return;await rpc("ll_admin_mark_paid",{p_admin:k,p_slug:x.dataset.paid});admin()});
 document.querySelectorAll("[data-pds]").forEach(x=>x.onclick=async()=>{await rpc("ll_admin_set_paydays",{p_admin:k,p_slug:x.dataset.pds,p_days:+document.querySelector(`[data-pd="${x.dataset.pds}"]`).value});admin()});
 document.querySelectorAll("[data-inv]").forEach(x=>x.onclick=()=>location.hash="#/inv/"+x.dataset.inv);
 $("#csv").onclick=()=>{const rows=[["business","code","name","phone","source","status","owner_amount","customer_bought","customer_amount","fee","flag","created"]].concat(d.leads.map(l=>[l.business,l.code,l.name,l.phone,l.src,l.status,l.owner_amount,l.cust_bought,l.cust_amount,l.fee,l.flag,l.created_at]));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n")],{type:"text/csv"}));a.download="leadlink-leads.csv";a.click()}}

async function invoice(slug){const k=localStorage.llAdmin;if(!k)return admin();const d=await rpc("ll_admin_view",{p_admin:k});const b=d.businesses.find(x=>x.slug===slug);if(!b){app.innerHTML="<div class=card>Not found.</div>";return}
 const ls=d.leads.filter(l=>l.slug===slug&&l.status==="sold"&&!l.paid_at),tot=ls.reduce((s,l)=>s+Number(l.fee),0),due=ls.length?new Date(Math.min(...ls.map(l=>+new Date(l.due)))):null,today=new Date();
 app.innerHTML=`<nav><button onclick="location.hash='#/'">Back</button><button class=alt onclick="print()">Print / Save PDF</button></nav>
 <div class=card><h2>INVOICE</h2><p class=muted>From: LeadLink Local · Date: ${today.toLocaleDateString()} · Invoice #${slug.toUpperCase()}-${today.toISOString().slice(0,10).replace(/-/g,"")}</p><p><b>Bill to:</b> ${esc(b.name)}${b.phone?" · "+esc(b.phone):""}</p>
 <table><tr><th>Code</th><th>Customer</th><th>Sale date</th><th>Job total</th><th>Fee</th><th>Due</th></tr>${ls.map(l=>`<tr><td>${l.code}</td><td>${esc(l.name)}</td><td>${new Date(l.sold_at||l.created_at).toLocaleDateString()}</td><td>${money(l.owner_amount)}</td><td>${money(l.fee)}</td><td>${new Date(l.due)<today?"<b style=color:#991b1b>OVERDUE</b> ":""}${new Date(l.due).toLocaleDateString()}</td></tr>`).join("")||"<tr><td colspan=6>Nothing owed right now.</td></tr>"}</table>
 <h3>Total due: ${money(tot)}</h3>${due?`<p>Payment due by <b>${due.toLocaleDateString()}</b> (${b.pay_days} days after each sale, per our referral agreement).</p>`:""}
 <p class=muted>Fees: ${money(b.flat_fee)} per sale, or ${b.pct}% on jobs of ${money(b.pct_threshold)}+. Every sale above was recorded in your owner portal with its customer code.</p></div>`}

function pitch(){app.innerHTML=`<nav><button onclick="location.hash='#/'">Back</button><button class=alt onclick="print()">Print</button></nav>
<div class=card><h2>More customers. Zero upfront cost.</h2><p>We run local video ads (TikTok and more) that send customers straight to your business with a unique code.</p>
<ul><li><b>You pay nothing up front.</b> No ad spend, no monthly fee.</li><li><b>You only pay when you make a sale:</b> a flat referral fee, or a small percentage on big jobs.</li><li><b>Build it into your estimate</b>, so the fee costs you nothing.</li><li><b>Your own portal:</b> see every lead, mark sales and see exactly what you owe.</li></ul></div>
<div class=card><h3>Referral Agreement (template)</h3><p>1. LeadLink ("Promoter") will advertise ______________ ("Business") at Promoter's own cost.</p><p>2. Each referred customer receives a unique code. A referral is a customer who presents a code or is recorded in the portal.</p><p>3. For each referral that becomes a sale, Business pays Promoter $____ per sale, or ____% of the job total on jobs of $______ or more, within ____ days of the sale. Late payments may pause advertising until paid.</p><p>4. Business agrees to update each lead's status in the portal within 7 days. Referred customers may be asked to confirm purchases.</p><p>5. Either party may end this agreement with 14 days' written notice. Fees for referrals made before then remain due.</p>
<p>Business: ______________ Signature: ______________ Date: ______</p><p>Promoter: ______________ Signature: ______________ Date: ______</p><p class=muted>Template only; have it reviewed before wide use.</p></div>`}
route();
</script></body></html>
